apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observability-demo-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 8888}]'

spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      # - path: /
      #   pathType: Prefix
      #   backend:
      #     service:
      #       name: hello-service
      #       port:
      #         number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hello-service
            port:
              number: 8080
      - path: /v1/traces
        pathType: Prefix
        backend:
          service:
            name: otel-collector
            port:
              number: 4318
