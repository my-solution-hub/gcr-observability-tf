apiVersion: apps/v1
kind: Deployment
metadata:
  name: world-service
  namespace: default
  labels:
    app: world-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: world-service
  template:
    metadata:
      labels:
        app: world-service
    spec:
      containers:
      - name: world-service
        image: ${WORLD_ECR_URL}:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        # Application configuration
        - name: DB_HOST
          value: "${RDS_ENDPOINT}"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "observability"
        - name: DB_USER
          value: "admin"
        - name: DB_PASSWORD
          value: "changeme123!"
        
        # OpenTelemetry configuration
        - name: OTEL_SERVICE_NAME
          value: "world-service"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=world-service,service.version=1.0.0"
        # - name: OTEL_EXPORTER_OTLP_ENDPOINT
        #   value: "http://cloudwatch-agent.amazon-cloudwatch:4315"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.default.svc.cluster.local:4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_LOG_LEVEL
          value: "debug"
        - name: OTEL_PYTHON_LOG_CORRELATION
          value: "true"
        - name: OTEL_PROPAGATORS
          value: "xray"
        - name: OTEL_PYTHON_ID_GENERATOR
          value: "xray"
        # - name: OTEL_METRICS_EXPORTER
        #   value: "otlp"
        # - name: OTEL_LOGS_EXPORTER
        #   value: "otlp"
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: world-service
  namespace: default
  labels:
    app: world-service
spec:
  selector:
    app: world-service
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
  type: ClusterIP
